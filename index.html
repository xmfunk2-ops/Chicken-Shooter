<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cheksiz Chicken Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 2px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        #score-board {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #00ffcc;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            width: 350px;
            height: 450px;
            background: #0b0914;
            border: 4px solid #ffcc00;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #110e1f;
        }
        #start-btn {
            margin-top: 15px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            background: #ffcc00;
            color: #111;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            transition: 0.2s;
        }
        #start-btn:active {
            transform: scale(0.95);
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #ff3366;
            font-weight: bold;
            display: none;
            z-index: 10;
        }
        #game-over span {
            font-size: 1rem;
            color: #fff;
            margin-top: 10px;
        }
        #restart-btn {
            margin-top: 15px;
            padding: 8px 16px;
            font-size: 0.9rem;
            background: #00ffcc;
            color: #111;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Chicken Shooter</h1>
    <div id="score-board">Hisob (Score): <span id="score">0</span></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="350" height="450"></canvas>
        <div id="game-over">
            O'yin Tugadi! 💥
            <span id="final-score">Natija: 0</span>
            <button id="restart-btn" onclick="resetGame()">Qaytadan O'ynash</button>
        </div>
    </div>

    <button id="start-btn">O'yinni Boshlash</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startBtn = document.getElementById("start-btn");
        const gameOverScreen = document.getElementById("game-over");
        const scoreEl = document.getElementById("score");
        const finalScoreEl = document.getElementById("final-score");

        let score = 0;
        let gameActive = false;
        let tiltX = 0;

        // Samolyot obyekti
        let player = {
            x: 160,
            y: 390,
            width: 36,
            height: 36,
            speed: 4.5
        };

        let bullets = [];
        let chickens = [];
        let spawnTimer = 0;

        function spawnChicken() {
            let chWidth = 30;
            let chHeight = 30;
            let chX = Math.random() * (canvas.width - chWidth);
            // Tovuqlar tezligi yumshatildi (haddan tashqari tez tushib ketmaydi)
            let chSpeed = 0.8 + Math.random() * 0.8 + (score * 0.005);
            chickens.push({ x: chX, y: -30, w: chWidth, h: chHeight, speed: chSpeed });
        }

        function update() {
            if (!gameActive) return;

            // Giroskop sezgirligi yumshatildi (bo'luvchi raqam kattalashtirildi)
            player.x += tiltX * player.speed;

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            // O'qlar harakati
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 7;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Tovuqlar chiqish vaqti biroz sekinlashtirildi
            spawnTimer++;
            if (spawnTimer > 55 - Math.min(score, 30)) {
                spawnChicken();
                spawnTimer = 0;
            }

            for (let i = chickens.length - 1; i >= 0; i--) {
                chickens[i].y += chickens[i].speed;

                if (chickens[i].y > canvas.height - 40) {
                    endGame();
                }

                if (
                    player.x < chickens[i].x + chickens[i].w &&
                    player.x + player.width > chickens[i].x &&
                    player.y < chickens[i].y + chickens[i].h &&
                    player.y + player.height > chickens[i].y
                ) {
                    endGame();
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j].x < chickens[i].x + chickens[i].w &&
                        bullets[j].x + bullets[j].w > chickens[i].x &&
                        bullets[j].y < chickens[i].y + chickens[i].h &&
                        bullets[j].y + bullets[j].h > chickens[i].y
                    ) {
                        chickens.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        scoreEl.innerText = score;
                        break;
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Samolyotni chizish
            ctx.save();
            let px = player.x;
            let py = player.y;

            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(px + 14, py + 4, 8, 28);

            ctx.fillStyle = '#00bcd4';
            ctx.fillRect(px + 2, py + 14, 32, 6);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(px + 10, py + 28, 16, 4);
            ctx.fillRect(px + 16, py + 32, 4, 4);

            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(px + 16, py, 4, 6);

            ctx.restore();

            // O'qlarni chizish
            ctx.fillStyle = '#ffcc00';
            for (let bullet of bullets) {
                ctx.fillRect(bullet.x, bullet.y, bullet.w, bullet.h);
            }

            // Tovuqlarni chizish
            ctx.font = '24px Arial';
            for (let chicken of chickens) {
                ctx.fillText('🐔', chicken.x, chicken.y + 24);
            }
        }

        function loop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(loop);
            }
        }

        function shoot() {
            if (!gameActive) return;
            bullets.push({
                x: player.x + player.width / 2 - 2,
                y: player.y,
                w: 4,
                h: 10
            });
        }

        setInterval(() => {
            if (gameActive) shoot();
        }, 350);

        function endGame() {
            gameActive = false;
            finalScoreEl.innerText = "Natija: " + score;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            scoreEl.innerText = score;
            chickens = [];
            bullets = [];
            player.x = 160;
            gameOverScreen.style.display = 'none';
            gameActive = true;
            loop();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') tiltX = -1.5;
            if (e.key === 'ArrowRight') tiltX = 1.5;
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'ArrowRight'].includes(e.key)) tiltX = 0;
        });

        startBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            startBtn.style.display = 'none';
                            gameActive = true;
                            loop();
                        } else {
                            alert("Giroskop uchun ruxsat berilmadi!");
                        }
                    }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                startBtn.style.display = 'none';
                gameActive = true;
                loop();
            }
        });

        function handleOrientation(event) {
            if (event.gamma !== null) {
                // Giroskop sezgirligi yumshatildi (9 ga bo'lindi, bu oldingiga qaraganda ancha silliqroq qiladi)
                tiltX = event.gamma / 9; 
            }
        }
    </script>
</body>
</html>
